services:
  client:
    build: ./client
    ports:
      - "15140:15140"
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
      - ./client/index.html:/app/index.html
      - ./client/vite.config.ts:/app/vite.config.ts

  server:
    build: ./server
    ports:
      - "15141:15141"
    volumes:
      - ./server/src:/app/src
